<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680">
  <defs>
    <!-- Outer Shield Drop Shadow -->
    <filter id="shieldShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1E36" flood-opacity="0.35" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="portraitShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Top Text Arc Path -->
    <path id="textArcTop" d="M 70,140 Q 300,50 530,140" fill="none" />
    
    <!-- Ribbon Text Arc Path -->
    <path id="ribbonArc" d="M 170,478 Q 300,432 430,478" fill="none" />

    <!-- Gradients -->
    <linearGradient id="skyBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#72C6F2" />
      <stop offset="40%" stop-color="#55B5E8" />
      <stop offset="100%" stop-color="#46A2D4" />
    </linearGradient>

    <linearGradient id="redBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E62727" />
      <stop offset="50%" stop-color="#D92323" />
      <stop offset="100%" stop-color="#B71818" />
    </linearGradient>

    <linearGradient id="ribbonWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F2F2F2" />
      <stop offset="100%" stop-color="#E2E2E2" />
    </linearGradient>

    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3432" />
      <stop offset="60%" stop-color="#1F1B1A" />
      <stop offset="100%" stop-color="#12100F" />
    </linearGradient>

    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5AF8B" />
      <stop offset="50%" stop-color="#D89A74" />
      <stop offset="100%" stop-color="#C08159" />
    </linearGradient>
  </defs>

  <!-- ==================== OUTER SHIELD BORDER ==================== -->
  <!-- Red Border Path -->
  <path d="M 30,105 
           Q 300,18 570,105 
           C 590,260 550,490 300,650 
           C 50,490 10,260 30,105 Z" 
        fill="url(#redBorderGrad)" 
        filter="url(#shieldShadow)" />

  <!-- Inner Sky Blue Field -->
  <path d="M 48,118 
           Q 300,42 552,118 
           C 570,265 532,476 300,626 
           C 68,476 30,265 48,118 Z" 
        fill="url(#skyBlueGrad)" />

  <!-- Thin inner white pinstripe for crispness -->
  <path d="M 54,124 
           Q 300,50 546,124 
           C 563,266 526,470 300,617 
           C 74,470 37,266 54,124 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- ==================== TOP ARCS & NUMBER ==================== -->
  <!-- Arched School Name -->
  <text font-family="'Times New Roman', 'Georgia', 'DejaVu Serif', serif" 
        font-weight="900" 
        font-size="36" 
        fill="#0D1B2A" 
        letter-spacing="2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      I.E. &quot;TÚPAC AMARU II&quot;
    </textPath>
  </text>

  <!-- Large Bold 24009 Number -->
  <text x="300" y="195" 
        text-anchor="middle" 
        font-family="'Times New Roman', 'Georgia', 'DejaVu Serif', serif" 
        font-weight="900" 
        font-size="58" 
        letter-spacing="6" 
        fill="#0D1B2A"
        stroke="#000000" 
        stroke-width="1.2">
    24009
  </text>

  <!-- ==================== WREATHS (FLANKING BRANCHES) ==================== -->
  <!-- Left Side: Palm Branch (Palma verde esbelta) -->
  <g id="palmBranch" transform="translate(0, 0)">
    <!-- Palm Stem -->
    <path d="M 230,480 C 170,440 120,350 140,230" fill="none" stroke="#165B33" stroke-width="5" stroke-linecap="round" />
    
    <!-- Palm Fronds Left side -->
    <!-- Top fronds -->
    <path d="M 140,230 Q 155,200 185,195 Q 165,220 145,235" fill="#2ECC71" stroke="#1B4D3E" stroke-width="1" />
    <path d="M 135,245 Q 115,215 140,190 Q 140,225 138,250" fill="#27AE60" stroke="#1B4D3E" stroke-width="1" />
    <path d="M 133,265 Q 95,240 105,210 Q 120,240 135,268" fill="#2ECC71" stroke="#1B4D3E" stroke-width="1" />
    <path d="M 130,290 Q 80,270 85,240 Q 110,265 132,293" fill="#27AE60" stroke="#1B4D3E" stroke-width="1" />
    <path d="M 133,320 Q 75,305 70,275 Q 105,295 136,323" fill="#2ECC71" stroke="#1B4D3E" stroke-width="1" />
    <path d="M 140,350 Q 80,340 75,310 Q 110,330 144,354" fill="#27AE60" stroke="#1B4D3E" stroke-width="1" />
    <path d="M 150,380 Q 95,380 85,350 Q 125,365 154,384" fill="#2ECC71" stroke="#1B4D3E" stroke-width="1" />
    <path d="M 165,410 Q 115,420 100,390 Q 140,400 170,414" fill="#27AE60" stroke="#1B4D3E" stroke-width="1" />
    <path d="M 185,440 Q 140,455 125,430 Q 160,435 190,444" fill="#2ECC71" stroke="#1B4D3E" stroke-width="1" />
    <path d="M 205,465 Q 165,485 155,465 Q 185,465 210,470" fill="#27AE60" stroke="#1B4D3E" stroke-width="1" />

    <!-- Inner fronds (facing inward) -->
    <path d="M 145,235 Q 175,250 185,275 Q 165,265 145,245" fill="#1E8449" />
    <path d="M 140,265 Q 180,285 190,310 Q 165,295 142,275" fill="#196F3D" />
    <path d="M 144,305 Q 185,325 195,350 Q 170,335 146,315" fill="#1E8449" />
    <path d="M 152,345 Q 195,365 200,390 Q 175,375 154,355" fill="#196F3D" />
    <path d="M 165,385 Q 205,405 210,430 Q 185,415 168,395" fill="#1E8449" />
  </g>

  <!-- Right Side: Laurel Branch with Red Berries -->
  <g id="laurelBranch" transform="translate(0, 0)">
    <!-- Laurel Stem -->
    <path d="M 370,480 C 430,440 480,350 460,230" fill="none" stroke="#165B33" stroke-width="5" stroke-linecap="round" />

    <!-- Laurel Leaves (oval shape with tips) -->
    <!-- Leaf 1 (top tip) -->
    <path d="M 460,230 Q 480,200 460,180 Q 440,205 460,230 Z" fill="#27AE60" stroke="#145A32" stroke-width="1" />
    <!-- Leaf 2 & 3 -->
    <path d="M 462,240 Q 505,230 500,210 Q 465,225 462,240 Z" fill="#2ECC71" stroke="#145A32" stroke-width="1" />
    <path d="M 458,245 Q 430,230 425,210 Q 450,230 458,245 Z" fill="#229954" stroke="#145A32" stroke-width="1" />
    <!-- Leaf 4 & 5 -->
    <path d="M 465,280 Q 520,270 515,245 Q 475,265 465,280 Z" fill="#2ECC71" stroke="#145A32" stroke-width="1" />
    <path d="M 458,285 Q 420,275 415,255 Q 445,275 458,285 Z" fill="#1E8449" stroke="#145A32" stroke-width="1" />
    <!-- Leaf 6 & 7 -->
    <path d="M 460,320 Q 525,320 520,295 Q 470,305 460,320 Z" fill="#2ECC71" stroke="#145A32" stroke-width="1" />
    <path d="M 450,325 Q 410,320 405,300 Q 435,315 450,325 Z" fill="#229954" stroke="#145A32" stroke-width="1" />
    <!-- Leaf 8 & 9 -->
    <path d="M 445,360 Q 515,370 510,345 Q 460,350 445,360 Z" fill="#2ECC71" stroke="#145A32" stroke-width="1" />
    <path d="M 435,365 Q 395,365 390,345 Q 420,360 435,365 Z" fill="#196F3D" stroke="#145A32" stroke-width="1" />
    <!-- Leaf 10 & 11 -->
    <path d="M 425,405 Q 490,420 485,395 Q 440,400 425,405 Z" fill="#2ECC71" stroke="#145A32" stroke-width="1" />
    <path d="M 410,410 Q 375,410 370,390 Q 395,405 410,410 Z" fill="#229954" stroke="#145A32" stroke-width="1" />
    <!-- Leaf 12 & 13 -->
    <path d="M 395,445 Q 455,470 450,445 Q 410,445 395,445 Z" fill="#27AE60" stroke="#145A32" stroke-width="1" />
    <path d="M 380,450 Q 350,455 345,435 Q 365,445 380,450 Z" fill="#1E8449" stroke="#145A32" stroke-width="1" />

    <!-- Laurel Red Berries (Frutos de café / laurel) -->
    <circle cx="480" cy="225" r="5.5" fill="#E74C3C" stroke="#78281F" stroke-width="1" />
    <circle cx="488" cy="235" r="5" fill="#C0392B" stroke="#78281F" stroke-width="1" />
    <circle cx="496" cy="265" r="5.5" fill="#E74C3C" stroke="#78281F" stroke-width="1" />
    <circle cx="490" cy="275" r="5" fill="#C0392B" stroke="#78281F" stroke-width="1" />
    <circle cx="498" cy="312" r="5.5" fill="#E74C3C" stroke="#78281F" stroke-width="1" />
    <circle cx="488" cy="324" r="5" fill="#C0392B" stroke="#78281F" stroke-width="1" />
    <circle cx="482" cy="365" r="5.5" fill="#E74C3C" stroke="#78281F" stroke-width="1" />
    <circle cx="474" cy="378" r="5" fill="#C0392B" stroke="#78281F" stroke-width="1" />
    <circle cx="452" cy="415" r="5.5" fill="#E74C3C" stroke="#78281F" stroke-width="1" />
    <circle cx="440" cy="425" r="5" fill="#C0392B" stroke="#78281F" stroke-width="1" />
  </g>

  <!-- ==================== CENTRAL PORTRAIT: TÚPAC AMARU II ==================== -->
  <g id="tupacAmaruPortrait" filter="url(#portraitShadow)">
    <!-- Back Hair Silhouette -->
    <path d="M 220,320 
             C 200,340 180,410 190,470 
             C 215,485 240,490 260,495 
             L 260,400 
             C 230,370 225,330 220,320 Z" fill="#120E0D" />
    <path d="M 380,320 
             C 400,340 420,410 410,470 
             C 385,485 360,490 340,495 
             L 340,400 
             C 370,370 375,330 380,320 Z" fill="#120E0D" />

    <!-- Dark Colonial Coat & Shoulders -->
    <path d="M 215,450 
             C 240,430 270,425 300,425 
             C 330,425 360,430 385,450 
             L 395,500 
             L 205,500 Z" fill="#1E232A" />

    <!-- White Cravat / Shirt Collar -->
    <path d="M 270,415 L 300,465 L 330,415 L 320,405 L 300,415 L 280,405 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1" />
    <path d="M 292,415 L 300,455 L 308,415 Z" fill="#F3F4F6" />

    <!-- Face & Neck -->
    <!-- Neck -->
    <path d="M 275,385 L 275,420 C 290,425 310,425 325,420 L 325,385 Z" fill="#C5855C" />
    
    <!-- Face Base -->
    <path d="M 250,300 
             C 245,340 250,380 270,398 
             C 285,412 315,412 330,398 
             C 350,380 355,340 350,300 
             Z" fill="url(#faceGrad)" stroke="#A0633C" stroke-width="1" />

    <!-- Facial Contours & Features -->
    <!-- Cheekbones shading -->
    <path d="M 256,335 C 265,360 275,380 285,388" fill="none" stroke="#B8734A" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 344,335 C 335,360 325,380 315,388" fill="none" stroke="#B8734A" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Eyebrows (bold, arched, dignified) -->
    <path d="M 262,318 Q 275,310 290,317" fill="none" stroke="#1A110B" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 338,318 Q 325,310 310,317" fill="none" stroke="#1A110B" stroke-width="4.5" stroke-linecap="round" />

    <!-- Eyes -->
    <ellipse cx="277" cy="326" rx="9" ry="5.5" fill="#FFFFFF" />
    <ellipse cx="278" cy="326" rx="4.5" ry="4.5" fill="#2C1D11" />
    <circle cx="279.5" cy="324.5" r="1.5" fill="#FFFFFF" />
    <path d="M 268,324 Q 278,320 288,325" fill="none" stroke="#120A05" stroke-width="2" />

    <ellipse cx="323" cy="326" rx="9" ry="5.5" fill="#FFFFFF" />
    <ellipse cx="322" cy="326" rx="4.5" ry="4.5" fill="#2C1D11" />
    <circle cx="323.5" cy="324.5" r="1.5" fill="#FFFFFF" />
    <path d="M 312,325 Q 322,320 332,324" fill="none" stroke="#120A05" stroke-width="2" />

    <!-- Noble Aquiline Nose -->
    <path d="M 300,315 L 297,348 Q 290,354 294,357 Q 300,359 306,357 Q 310,354 303,348 Z" fill="#BF7C52" stroke="#9A5932" stroke-width="0.8" />

    <!-- Lips (determined expression) -->
    <path d="M 285,372 Q 300,369 315,372" fill="none" stroke="#8A3D24" stroke-width="3" stroke-linecap="round" />
    <path d="M 290,375 Q 300,380 310,375" fill="none" stroke="#A75133" stroke-width="2.5" stroke-linecap="round" />

    <!-- Chin definition -->
    <path d="M 293,392 Q 300,395 307,392" fill="none" stroke="#9A5932" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- Iconic Colonial Broad-Brim Hat -->
    <!-- Hat Crown (Tall, slightly tapered) -->
    <path d="M 252,282 
             C 250,225 258,205 270,198 
             C 285,190 315,190 330,198 
             C 342,205 350,225 348,282 Z" fill="url(#hatGrad)" stroke="#0A0807" stroke-width="1.5" />
    
    <!-- Hat Ribbon Band -->
    <path d="M 252,274 Q 300,278 348,274 L 348,282 Q 300,286 252,282 Z" fill="#1E232A" />

    <!-- Hat Wide Brim (Iconic curved brim spanning wide) -->
    <path d="M 200,286 
             C 215,268 250,268 300,268 
             C 350,268 385,268 400,286 
             C 390,302 350,306 300,306 
             C 250,306 210,302 200,286 Z" fill="url(#hatGrad)" stroke="#050404" stroke-width="2" />
    
    <!-- Shadow cast by brim over face -->
    <path d="M 248,296 Q 300,302 352,296 C 348,310 335,316 300,316 C 265,316 252,310 248,296 Z" fill="#000000" opacity="0.3" />
  </g>

  <!-- ==================== MOTTO BANNER (RIBBON) ==================== -->
  <!-- Peruvian Tricolor Ribbon (Red folds on sides, White banner with red trim) -->
  <g id="mottoRibbon" filter="url(#portraitShadow)">
    <!-- Left Ribbon Tails (folds) -->
    <path d="M 152,475 L 180,455 L 188,485 L 160,505 Z" fill="#B71818" />
    <path d="M 160,505 L 188,485 L 192,525 L 175,545 L 160,505 Z" fill="#D92323" stroke="#B71818" stroke-width="1" />
    <path d="M 168,520 L 182,505 L 184,528 L 175,538 Z" fill="#FFFFFF" />

    <!-- Right Ribbon Tails (folds) -->
    <path d="M 448,475 L 420,455 L 412,485 L 440,505 Z" fill="#B71818" />
    <path d="M 440,505 L 412,485 L 408,525 L 425,545 L 440,505 Z" fill="#D92323" stroke="#B71818" stroke-width="1" />
    <path d="M 432,520 L 418,505 L 416,528 L 425,538 Z" fill="#FFFFFF" />

    <!-- Main Front Arched Ribbon -->
    <!-- Top red stripe of ribbon -->
    <path d="M 172,460 Q 300,418 428,460 L 425,470 Q 300,428 175,470 Z" fill="#D92323" />
    
    <!-- White center body of ribbon -->
    <path d="M 175,470 Q 300,428 425,470 L 420,504 Q 300,462 180,504 Z" fill="url(#ribbonWhiteGrad)" stroke="#D1D5DB" stroke-width="1" />

    <!-- Bottom red stripe of ribbon -->
    <path d="M 180,504 Q 300,462 420,504 L 418,514 Q 300,472 182,514 Z" fill="#D92323" />

    <!-- Motto Text: ESTUDIO • SUPERACIÓN • TRABAJO -->
    <text font-family="'Arial Black', 'Helvetica Neue', sans-serif" 
          font-weight="900" 
          font-size="19" 
          fill="#B71818" 
          letter-spacing="2.5">
      <textPath href="#ribbonArc" startOffset="50%" text-anchor="middle">
        ESTUDIO SUPERACIÓN TRABAJO
      </textPath>
    </text>
  </g>

  <!-- ==================== BOTTOM INSTITUTIONAL LOCATION ==================== -->
  <text x="300" y="585" 
        text-anchor="middle" 
        font-family="'Times New Roman', 'Georgia', 'DejaVu Serif', serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="5" 
        fill="#0D1B2A"
        stroke="#000000" 
        stroke-width="1.2">
    PUQUIO
  </text>
</svg>